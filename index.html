<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Hockey</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #334155; /* Slate 700 - Neutral wall/floor */
            touch-action: none;
        }
        canvas {
            background-color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 16px;
            cursor: none;
            border: 12px solid #cbd5e1; /* Table border */
        }
        .game-ui {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen game-ui select-none">

    <!-- Score Board -->
    <div class="absolute top-4 w-full max-w-lg flex justify-between px-10 text-3xl font-bold z-10 pointer-events-none text-white drop-shadow-md">
        <div class="text-red-400">AI: <span id="score-com">0</span></div>
        <div class="text-blue-400">YOU: <span id="score-player">0</span></div>
    </div>

    <div id="game-container" class="relative">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay: Start / Game Over -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 rounded-xl z-20 backdrop-blur-sm">
            <h1 id="game-title" class="text-5xl font-extrabold text-white mb-2 tracking-wider">AIR HOCKEY</h1>
            <p id="game-subtitle" class="text-gray-300 mb-8 text-lg">First to 5 Goals Wins!</p>
            
            <div id="difficulty-menu" class="flex flex-col gap-4 w-64">
                <button onclick="startGame('easy')" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg shadow-lg transition transform hover:scale-105">
                    EASY
                </button>
                <button onclick="startGame('medium')" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-lg shadow-lg transition transform hover:scale-105">
                    MEDIUM
                </button>
                <button onclick="startGame('hard')" class="px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg shadow-lg transition transform hover:scale-105">
                    HARD
                </button>
            </div>

            <div id="game-over-menu" class="hidden flex-col items-center gap-4">
                <h2 id="winner-text" class="text-4xl font-bold text-white mb-4">YOU WIN!</h2>
                <button onclick="showMainMenu()" class="px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg transition transform hover:scale-105">
                    MAIN MENU
                </button>
            </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdown-display" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden z-30">
            <span id="countdown-text" class="text-9xl font-black text-slate-800 opacity-80 animate-ping">3</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scorePlayerEl = document.getElementById('score-player');
        const scoreComEl = document.getElementById('score-com');
        const uiLayer = document.getElementById('ui-layer');
        const difficultyMenu = document.getElementById('difficulty-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const gameTitle = document.getElementById('game-title');
        const gameSubtitle = document.getElementById('game-subtitle');
        const winnerText = document.getElementById('winner-text');
        const countdownDisplay = document.getElementById('countdown-display');
        const countdownText = document.getElementById('countdown-text');

        // Game Constants
        const BOARD_WIDTH = 400;
        const BOARD_HEIGHT = 700;
        const PUCK_RADIUS = 15;
        const PADDLE_RADIUS = 25;
        const GOAL_WIDTH = 140;
        const FRICTION = 0.992; 
        const WIN_SCORE = 5;
        
        // Game State
        let gameState = 'MENU'; 
        let scorePlayer = 0;
        let scoreCom = 0;
        let scale = 1;
        let difficulty = 'medium';

        // Entities
        const puck = {
            x: BOARD_WIDTH / 2,
            y: BOARD_HEIGHT / 2,
            radius: PUCK_RADIUS,
            dx: 0,
            dy: 0,
            color: '#000000' // Black Puck
        };

        const player = {
            x: BOARD_WIDTH / 2,
            y: BOARD_HEIGHT - 100,
            radius: PADDLE_RADIUS,
            color: '#3b82f6', // Blue Mallet
            score: 0
        };

        const com = {
            x: BOARD_WIDTH / 2,
            y: 100,
            radius: PADDLE_RADIUS,
            dx: 0,
            dy: 0,
            speed: 4, 
            color: '#ef4444', // Red Mallet
            score: 0,
            // AI Props
            reactionDelay: 0,
            errorMargin: 0,
            strategy: 'normal'
        };

        // Resize handling
        function resize() {
            const margin = 20;
            const maxWidth = window.innerWidth - margin;
            const maxHeight = window.innerHeight - margin;

            const scaleX = maxWidth / BOARD_WIDTH;
            const scaleY = maxHeight / BOARD_HEIGHT;
            scale = Math.min(scaleX, scaleY, 1.3);

            canvas.width = BOARD_WIDTH * scale;
            canvas.height = BOARD_HEIGHT * scale;
            
            if(gameState === 'MENU' || gameState === 'GAMEOVER') draw();
        }

        window.addEventListener('resize', resize);
        resize();

        // Input handling
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height - 100 * scale;

        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            mouseX = clientX - rect.left;
            mouseY = clientY - rect.top;
        }

        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, { passive: false });

        // Game Control Functions
        function showMainMenu() {
            gameState = 'MENU';
            uiLayer.classList.remove('hidden');
            difficultyMenu.classList.remove('hidden');
            gameOverMenu.classList.add('hidden');
            gameTitle.textContent = "AIR HOCKEY";
            gameSubtitle.textContent = "First to 5 Goals Wins!";
            resetBoard();
            scorePlayer = 0;
            scoreCom = 0;
            updateScoreDisplay();
            draw();
        }

        function startGame(selectedDifficulty) {
            difficulty = selectedDifficulty;
            
            // Set AI Stats based on difficulty
            if (difficulty === 'easy') {
                com.speed = 3;
                com.reactionDelay = 0.15; 
                com.errorMargin = 30; 
            } else if (difficulty === 'medium') {
                com.speed = 5;
                com.reactionDelay = 0.08;
                com.errorMargin = 10;
            } else if (difficulty === 'hard') {
                com.speed = 7.5;
                com.reactionDelay = 0.04; 
                com.errorMargin = 0; 
            }

            uiLayer.classList.add('hidden');
            startCountdown();
        }

        function startCountdown() {
            gameState = 'COUNTDOWN';
            let count = 3;
            countdownDisplay.classList.remove('hidden');
            countdownText.textContent = count;
            
            // Reset positions
            resetBoard();
            draw();

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.textContent = count;
                    // Reset animation
                    countdownText.style.animation = 'none';
                    countdownText.offsetHeight; 
                    countdownText.style.animation = null; 
                } else {
                    clearInterval(timer);
                    countdownDisplay.classList.add('hidden');
                    gameState = 'PLAYING';
                    loop();
                }
            }, 1000);
        }

        function gameOver(winner) {
            gameState = 'GAMEOVER';
            uiLayer.classList.remove('hidden');
            difficultyMenu.classList.add('hidden');
            gameOverMenu.classList.remove('hidden');
            gameTitle.textContent = "GAME OVER";
            gameSubtitle.textContent = "";
            
            if (winner === 'player') {
                winnerText.textContent = "YOU WIN!";
                winnerText.className = "text-5xl font-bold text-blue-400 mb-4";
            } else {
                winnerText.textContent = "COMPUTER WINS!";
                winnerText.className = "text-5xl font-bold text-red-400 mb-4";
            }
        }

        function updateScoreDisplay() {
            scorePlayerEl.textContent = scorePlayer;
            scoreComEl.textContent = scoreCom;
        }

        function handleGoal(scorer) {
            if (gameState !== 'PLAYING') return;
            gameState = 'SCORING';

            if (scorer === 'player') scorePlayer++;
            else scoreCom++;
            
            updateScoreDisplay();

            // Check Win Condition
            if (scorePlayer >= WIN_SCORE) {
                setTimeout(() => gameOver('player'), 500);
            } else if (scoreCom >= WIN_SCORE) {
                setTimeout(() => gameOver('com'), 500);
            } else {
                setTimeout(() => {
                    resetBoard();
                    gameState = 'PLAYING';
                }, 1500);
            }
        }

        function resetBoard() {
            puck.x = BOARD_WIDTH / 2;
            puck.y = BOARD_HEIGHT / 2;
            puck.dx = 0;
            puck.dy = 0;
            
            // Reset paddles slightly
            player.x = BOARD_WIDTH / 2;
            player.y = BOARD_HEIGHT - 100;
            com.x = BOARD_WIDTH / 2;
            com.y = 100;
        }

        // Physics Helpers
        function checkPaddleCollision(paddle, vX, vY) {
            const dx = puck.x - paddle.x;
            const dy = puck.y - paddle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < puck.radius + paddle.radius) {
                // Normal Vector
                const nx = dx / distance;
                const ny = dy / distance;

                // Move puck out
                const overlap = (puck.radius + paddle.radius) - distance;
                puck.x += nx * overlap;
                puck.y += ny * overlap;

                // Relative velocity
                const rvX = puck.dx - vX;
                const rvY = puck.dy - vY;
                
                // Velocity along normal
                const velAlongNormal = rvX * nx + rvY * ny;

                if (velAlongNormal > 0) return;

                const restitution = 0.7; // Less bouncy than neon mode for 'real' feel
                let j = -(1 + restitution) * velAlongNormal;
                
                puck.dx += j * nx;
                puck.dy += j * ny;

                // Add active push
                puck.dx += vX * 0.5;
                puck.dy += vY * 0.5;

                // Max Speed Cap
                const speed = Math.sqrt(puck.dx**2 + puck.dy**2);
                const maxSpeed = 18; 
                if (speed > maxSpeed) {
                    const ratio = maxSpeed / speed;
                    puck.dx *= ratio;
                    puck.dy *= ratio;
                }
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // --- Player Movement ---
            let targetX = mouseX / scale;
            let targetY = mouseY / scale;

            targetX = Math.max(player.radius, Math.min(BOARD_WIDTH - player.radius, targetX));
            targetY = Math.max(BOARD_HEIGHT / 2 + player.radius, Math.min(BOARD_HEIGHT - player.radius, targetY));

            const pVx = targetX - player.x;
            const pVy = targetY - player.y;

            player.x = targetX;
            player.y = targetY;

            // --- AI Logic ---
            let comTargetX = puck.x;
            let comTargetY = 100;
            let ease = 0.1; 

            let targetOffsetX = 0;
            if (difficulty === 'easy') {
                targetOffsetX = Math.sin(Date.now() / 500) * com.errorMargin;
            }

            if (puck.y < BOARD_HEIGHT / 2) {
                // Puck in AI territory
                
                // Stuck Check
                const isStuckLeft = puck.x < 70 && puck.y < 100;
                const isStuckRight = puck.x > BOARD_WIDTH - 70 && puck.y < 100;

                if ((isStuckLeft || isStuckRight) && Math.abs(puck.dy) < 1) {
                    comTargetY = puck.y;
                    if (isStuckLeft) comTargetX = puck.x + 25;
                    else comTargetX = puck.x - 25;
                    ease = 0.2; 
                } 
                // Behind check
                else if (puck.y < com.y - 10) {
                    comTargetY = puck.y - 50;
                    if (puck.x < BOARD_WIDTH/2) comTargetX = puck.x + 60;
                    else comTargetX = puck.x - 60;
                    ease = 0.15;
                }
                // Attack
                else {
                    comTargetX = puck.x + targetOffsetX;
                    comTargetY = Math.max(com.radius + 10, puck.y - 60);
                    
                    // If close, strike
                    if (Math.abs(puck.x - com.x) < 50 && puck.y < com.y + 120) {
                        comTargetX = puck.x;
                        comTargetY = puck.y;
                        ease = com.reactionDelay * 3; // Lunge speed
                    } else {
                        ease = com.reactionDelay; // Normal movement speed
                    }
                }
            } else {
                // Defense
                comTargetY = 100;
                comTargetX = BOARD_WIDTH / 2;
                ease = 0.05;
            }

            // Move Com
            const cVx = (comTargetX - com.x) * ease;
            const cVy = (comTargetY - com.y) * ease;
            
            // Limit Com Speed
            const cSpeed = Math.sqrt(cVx**2 + cVy**2);
            let actualCVx = cVx;
            let actualCVy = cVy;
            if (cSpeed > com.speed) {
                const ratio = com.speed / cSpeed;
                actualCVx *= ratio;
                actualCVy *= ratio;
            }

            com.x += actualCVx;
            com.y += actualCVy;

            // Constrain Com
            com.x = Math.max(com.radius, Math.min(BOARD_WIDTH - com.radius, com.x));
            com.y = Math.max(com.radius, Math.min(BOARD_HEIGHT / 2 - com.radius, com.y));


            // --- Puck Physics ---
            puck.x += puck.dx;
            puck.y += puck.dy;

            puck.dx *= FRICTION;
            puck.dy *= FRICTION;

            // Walls
            if (puck.x - puck.radius < 0) {
                puck.x = puck.radius;
                puck.dx *= -1;
            } else if (puck.x + puck.radius > BOARD_WIDTH) {
                puck.x = BOARD_WIDTH - puck.radius;
                puck.dx *= -1;
            }

            // Top/Bottom (Goal Check)
            if (puck.y - puck.radius < 0) {
                if (puck.x > (BOARD_WIDTH - GOAL_WIDTH)/2 && puck.x < (BOARD_WIDTH + GOAL_WIDTH)/2) {
                    handleGoal('player');
                    return;
                }
                puck.y = puck.radius;
                puck.dy *= -1;
            } else if (puck.y + puck.radius > BOARD_HEIGHT) {
                if (puck.x > (BOARD_WIDTH - GOAL_WIDTH)/2 && puck.x < (BOARD_WIDTH + GOAL_WIDTH)/2) {
                    handleGoal('com');
                    return;
                }
                puck.y = BOARD_HEIGHT - puck.radius;
                puck.dy *= -1;
            }

            // Collisions
            checkPaddleCollision(player, pVx, pVy);
            checkPaddleCollision(com, actualCVx, actualCVy);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(scale, scale);

            // --- Board Design (Classic White Surface) ---
            ctx.fillStyle = '#f1f5f9'; // Slate 100
            ctx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);

            // Markings
            ctx.lineWidth = 4;
            
            // Center Line (Red)
            ctx.strokeStyle = '#ef4444'; 
            ctx.beginPath();
            ctx.moveTo(0, BOARD_HEIGHT / 2);
            ctx.lineTo(BOARD_WIDTH, BOARD_HEIGHT / 2);
            ctx.stroke();

            // Center Circle (Red)
            ctx.beginPath();
            ctx.arc(BOARD_WIDTH / 2, BOARD_HEIGHT / 2, 60, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.strokeStyle = '#ef4444';
            
            // Top Crease
            ctx.beginPath();
            ctx.arc(BOARD_WIDTH / 2, 0, 80, 0, Math.PI);
            ctx.stroke();

            // Bottom Crease
            ctx.beginPath();
            ctx.arc(BOARD_WIDTH / 2, BOARD_HEIGHT, 80, Math.PI, 0);
            ctx.stroke();

            // Goals (Indented dark area)
            ctx.fillStyle = '#1e293b';
            const goalX = (BOARD_WIDTH - GOAL_WIDTH) / 2;
            ctx.fillRect(goalX, -10, GOAL_WIDTH, 15); // Top
            ctx.fillRect(goalX, BOARD_HEIGHT - 5, GOAL_WIDTH, 15); // Bottom

            // --- Entities ---
            
            // Puck (Solid Red)
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = puck.color;
            ctx.fill();
            // Puck sheen/detail
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(puck.x - 4, puck.y - 4, puck.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
            // Puck rim
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.stroke();


            // Player Paddle (Blue)
            drawPaddle(player, '#2563eb', '#1d4ed8');

            // Com Paddle (Red)
            drawPaddle(com, '#dc2626', '#b91c1c');

            // Scored Overlay
            if (gameState === 'SCORING') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 50px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GOAL!', BOARD_WIDTH / 2, BOARD_HEIGHT / 2);
            }

            ctx.restore();
        }

        function drawPaddle(p, colorMain, colorDark) {
            // Main Body
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = colorMain;
            ctx.fill();
            
            // 3D Rim effect
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();

            // Handle (Darker center)
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = colorDark;
            ctx.fill();
            
            // Handle Highlight
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function loop() {
            if (gameState === 'PLAYING' || gameState === 'SCORING') {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
        
        // Initial Render
        draw();

    </script>
</body>
</html>
